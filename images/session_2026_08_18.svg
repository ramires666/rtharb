  <path d="M 70.0,575.0 L 140.0,612.0 L 250.0,575.0 L 350.0,570.0 L 450.0,565.0 L 550.0,560.0 L 650.0,530.0 L 750.0,540.0 L 850.0,550.0 L 950.0,560.0 L 1050.0,565.0 L 1140.0,575.0" fill="none" stroke="#00E5FF" stroke-width="2"/>

