  <line x1="70" y1="366.0" x2="1140" y2="366.0" stroke="#262D3D" stroke-dasharray="3"/><text x="15" y="370.0" fill="#8F9CAE" font-size="11" font-family="sans-serif">$123.60</text>
  <line x1="70" y1="292.0" x2="1140" y2="292.0" stroke="#262D3D" stroke-dasharray="3"/><text x="15" y="296.0" fill="#8F9CAE" font-size="11" font-family="sans-serif">$124.20</text>
  <line x1="70" y1="218.0" x2="1140" y2="218.0" stroke="#262D3D" stroke-dasharray="3"/><text x="15" y="222.0" fill="#8F9CAE" font-size="11" font-family="sans-serif">$124.80</text>
  <line x1="70" y1="144.0" x2="1140" y2="144.0" stroke="#262D3D" stroke-dasharray="3"/><text x="15" y="148.0" fill="#8F9CAE" font-size="11" font-family="sans-serif">$125.40</text>
  <line x1="70" y1="70.0" x2="1140" y2="70.0" stroke="#262D3D" stroke-dasharray="3"/><text x="15" y="74.0" fill="#8F9CAE" font-size="11" font-family="sans-serif">$126.00</text>

  <!-- Fair Value Line -->
  <path d="M 70.0,360.0 L 150.0,350.0 L 250.0,340.0 L 350.0,330.0 L 450.0,320.0 L 550.0,310.0 L 650.0,300.0 L 750.0,290.0 L 850.0,280.0 L 950.0,270.0 L 1050.0,260.0 L 1140.0,250.0" fill="none" stroke="#FFD600" stroke-width="2.2" stroke-dasharray="5,3"/>

  <!-- Candlesticks Trajectory -->
  <path d="M 70.0,350.0 L 140.0,410.0 L 250.0,320.0 L 350.0,300.0 L 450.0,290.0 L 550.0,280.0 L 650.0,160.0 L 750.0,180.0 L 850.0,200.0 L 950.0,220.0 L 1050.0,230.0 L 1140.0,250.0" fill="none" stroke="#00E676" stroke-width="1.8" />

