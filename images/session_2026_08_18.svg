  <line x1="895" y1="94" x2="920" y2="94" stroke="#FFD600" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="930" y="98" fill="#FFD600" font-size="11" font-weight="bold" font-family="sans-serif">Fair Value (QQQ * Beta)</text>

