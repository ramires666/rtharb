  <line x1="70" y1="541.6" x2="1140" y2="541.6" stroke="#FF5252" stroke-dasharray="3"/><text x="25" y="545.6" fill="#FF5252" font-size="11" font-family="sans-serif">+1.5σ</text>
  <line x1="70" y1="575.0" x2="1140" y2="575.0" stroke="#262D3D" /><text x="25" y="579.0" fill="#8F9CAE" font-size="11" font-family="sans-serif">0.0σ</text>
  <line x1="70" y1="608.4" x2="1140" y2="608.4" stroke="#00E676" stroke-dasharray="3"/><text x="25" y="612.4" fill="#00E676" font-size="11" font-family="sans-serif">-1.5σ</text>
  <line x1="70" y1="650.0" x2="1140" y2="650.0" stroke="#D50000" stroke-dasharray="3"/><text x="25" y="654.0" fill="#D50000" font-size="11" font-family="sans-serif">-4.0σ</text>

