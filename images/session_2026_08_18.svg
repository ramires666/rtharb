  <polygon points="140.0,400.0 135.0,410.0 145.0,410.0" fill="#00E676" stroke="#FFF"/>
  <rect x="110.0" y="412.0" width="60" height="18" fill="#0A2E1C" stroke="#00E676" rx="3"/>
  <text x="140.0" y="424.0" fill="#00E676" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">▲ BUY</text>

  <rect x="225.0" y="305.0" width="50" height="18" fill="#0A2E1C" stroke="#00E676" rx="3"/>
  <text x="250.0" y="317.0" fill="#00E676" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">✖ TP</text>

  <!-- Trade 2: Short (13:10 -> 15:10, Time-Stop 120m) -->
  <polygon points="650.0,170.0 645.0,160.0 655.0,160.0" fill="#FF5252" stroke="#FFF"/>
  <rect x="615.0" y="140.0" width="70" height="18" fill="#3D1217" stroke="#FF5252" rx="3"/>
  <text x="650.0" y="152.0" fill="#FF5252" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">▼ SHORT</text>

  <rect x="1010.0" y="215.0" width="80" height="18" fill="#38300E" stroke="#FFD600" rx="3"/>
  <text x="1050.0" y="227.0" fill="#FFD600" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">✖ TIME 120m</text>

